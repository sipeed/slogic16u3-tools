# SLogic16U3 产品档案（公开，入库）
# 新增产品：复制本目录为 resources/products/<product_id>/，改 product.toml +
# programmer.toml 各字段，把固件/密钥放进 firmware/，无需改代码。
schema_version = 1

[product]
id = "slogic16u3"            # 必须与所在目录名一致
display_name = "SLogic16U3"

[usb]
vid = 0x359F
app_pid = 0x3031             # 应用固件运行时的 PID
dfu_pid = 0x30F1             # "SLogic DFU"，各产品共用（DFU 不区分型号）；未知时删除本行，GUI 提示 "DFU 未配置"

[capture]
driver = "sipeed-slogic-analyzer"   # sigrok 驱动名
num_channels = 16                   # 硬件通道总数（决定数据流 unitsize = ceil(16/8) = 2 字节/样本）
max_bandwidth_mbps = 400            # 约束: channels × rate / 8 ≤ 此值
channel_options = [4, 8, 16]
# 采样率档位。高档位需要更少通道的分组：采样时工具自动先下发
# logic_channels=<通道数>（Num of logic channels，切换分组）再设采样率，
# 数据流宽度随分组变化（unitsize = ceil(通道数/8)）。
# 带宽约束 channels × rate / 8 ≤ max_bandwidth_mbps 决定各通道数可选的档位。
samplerates = ["5M", "8M", "10M", "16M", "20M", "25M", "32M", "40M", "50M", "80M", "100M", "160M", "200M", "400M"]
voltage_threshold_v = 1.6
default_samples = "1M"
default_channels = 16        # GUI 默认选择
default_samplerate = "200M"

# 一键全流程要跑的测试点，可配置多组
[[capture.tests]]
channels = 16
samplerate = "200M"
samples = "1M"

[expected]
# 外置固定信号源：10MHz 50% 3.3V TTL，接入全部通道
freq_hz = 10_000_000
duty_pct = 50.0
freq_tol_pct = 5.0           # 频率相对容差 (%)
duty_tol_pp = 5.0            # 占空比绝对容差（百分点）

[firmware]
app = "firmware/app.bin"     # 相对本产品目录；由管理员放置（gitignore）
app_flash_addr = 0x0         # 应用固件在 SPI Flash 中的烧写起始地址
verify = true                # 烧写后回读校验

[mode_switch]
# DFU<->APP 切换按可用方案自动分派（无需脚本）：
#   1. usb_reconfig = true：产品自身 USB 控制传输 RECONFIG（16U3 不支持）；
#   2. programmer.toml [programmer.switch]：外置烧录器保底方案；
#   3. 都没有 -> GUI 弹窗提示按板载 MODE 按键，随后自动等待目标模式设备。
usb_reconfig = false
timeout_s = 60

[timeouts]
wait_dfu_device_s = 30
wait_app_device_s = 30
dfu_flash_s = 600
capture_s = 120
blank_flash_step_s = 120
