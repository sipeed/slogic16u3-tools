# SLogic16U3 产品档案（公开，入库）
# 新增产品：复制本目录为 resources/products/<product_id>/，改 product.toml
# 各字段，无需改代码。
#
# 信号源：与 32U3 同一套 Tang Nano 9K 夹具（testgen，M0..M6）。16U3 只有 16 路，
# 接夹具的 CH0..CH15（经转接线）；这 16 路都来自 3.3 V bank，1.8 V 的 bank 3
# 在 CH20..CH25，16U3 用不到，所以一个阈值就够、不需要双阈值。
# 期望值同样由 slogicpt/patterns.py 按 RTL 推导，本文件只声明"测什么"。
schema_version = 1

[product]
id = "slogic16u3"            # 必须与所在目录名一致
display_name = "SLogic16U3"

[usb]
vid = 0x359F
app_pid = 0x3031             # 应用固件运行时的 PID
dfu_pid = 0x30F1             # 16U3 DFU PID（32U3 用 0x30F2 区分）；用于识别"还在 DFU、没烧 app 固件"的板子
links = ["5G"]               # 产测工位链路（逐轮）；达不到 5G 直接 FAIL。16U3 400 MB/s，5G 足够
# reconfig 未开：16U3 不支持 USB RECONFIG 切换 APP/DFU，产测不做来回切换这一步

# ---------------------------------------------------------------------------
# 夹具信号源（与 32U3 相同，说明见 slogic32u3/product.toml）
# ---------------------------------------------------------------------------
# 夹具的 VID/PID、序列号关键字在 resources/fixture.toml（各产品共用）；
# 换批次/换固件只改那个文件。
[signal_source]
serial           = "auto"
baud             = 115200
settle_ms        = 400      # 切模式后的稳定延时
reply_timeout_ms = 1000     # 等 "MODE n" 回复的超时
firmware         = "../../fixture/testgen.fs"   # 夹具位流，各产品共用（入库）

[capture]
driver = "sipeed-slogic-analyzer"   # sigrok 驱动名
num_channels = 16                   # 硬件通道总数（决定数据流 unitsize = ceil(16/8) = 2 字节/样本）
max_bandwidth_mbps = 400            # 约束: channels × rate / 8 ≤ 此值
# 采样率档位。高档位需要更少通道的分组：采样时工具自动先下发
# logic_channels=<通道数>（Num of logic channels，切换分组）再设采样率，
# 数据流宽度随分组变化（unitsize = ceil(通道数/8)）。
# 带宽约束 channels × rate / 8 ≤ max_bandwidth_mbps 决定各通道数可选的档位。
samplerates = ["5M", "8M", "10M", "16M", "20M", "25M", "32M", "40M", "50M", "80M", "100M", "160M", "200M", "400M"]
voltage_threshold_v = 1.6

[timeouts]
capture_s = 120

# ===========================================================================
# 测试计划：7 个模式，一轮 5G（[usb] links = ["5G"]）
# ===========================================================================
# 16U3 总带宽 400 MB/s：4ch/8ch 最高 400M，16ch 最高 200M。
# 夹具按 32 路设计，16U3 看到的是 CH0..CH15：
#   M0 轮转仍是 32 步一圈（CH15 之后空 17 步才回到 CH0），轮转检查按 32 步算；
#   M4 只解前 4 组 SPI（CH0..CH15），I2C/UART 在 CH24..CH26，16U3 不测；
#   M5/M6 的填充只覆盖 CH5..CH15 / CH4..CH15。
# 用 32U3 的实采数据抽成上面各档离线复算，7 个模式全部通过（M1 在 400M 下每个
# SCLK 周期约 7 个采样点，三种采样相位都能完整解码）。真机仍待验证。

[[plan]]
mode    = 0
label   = "wiring / mapping"
ready   = true
checks  = ["order"]
note    = "the rotation check carries the verdict; the fixture rotates over 32 steps, 16U3 sees the first 16"
configs = [
  { channels = 16, samplerate = "200M", window_ms = 10, max_samples = 8000000, link = "5G" }
]

[[plan]]
mode    = 1
label   = "4ch SPI @54 MHz"
ready   = true
checks  = ["protocol"]
configs = [
  { channels = 4, samplerate = "400M", window_ms = 2, max_samples = 8000000, link = "5G" }
]

[[plan]]
mode    = 2
label   = "8ch SPI @27 MHz"
ready   = true
checks  = ["protocol"]
configs = [
  { channels = 8, samplerate = "400M", window_ms = 10, max_samples = 8000000, link = "5G" }
]

[[plan]]
mode    = 3
label   = "16ch SPI @13.5 MHz"
ready   = true
checks  = ["protocol"]
configs = [
  { channels = 16, samplerate = "200M", window_ms = 10, max_samples = 8000000, link = "5G" }
]

[[plan]]
mode    = 4
label   = "SPI @6.75 MHz (CH0..CH15)"
ready   = true
checks  = ["protocol"]
configs = [
  { channels = 16, samplerate = "200M", window_ms = 10, max_samples = 8000000, link = "5G" }
]

[[plan]]
mode    = 5
label   = "narrow pulse"
ready   = true
checks  = ["freq"]
note    = "CH2/CH3/CH4 判脉冲宽度；CH5..CH15 是 1 kHz 填充（相邻反相），窗口 4 ms"
configs = [
  { channels = 16, samplerate = "200M", window_ms = 4, max_samples = 8000000, link = "5G" }
]

[[plan]]
mode    = 6
label   = "burst / trigger"
ready   = true
checks  = ["burst"]
configs = [
  { channels = 16, samplerate = "200M", window_ms = 40, max_samples = 8000000, link = "5G" }
]
