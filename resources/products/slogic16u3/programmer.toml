# SLogic16U3 外置烧录器声明（公开，入库）
#
# 绝大多数字段（cli / cable_candidates / [programmer.flash] / [programmer.efuse]）都在
# 共享 resources/programmer.toml 里给了默认值——**这里通常只需声明 device 一项**
# （device 是唯一各产品不同、必填、无默认的字段：IDCODE 必须精确匹配）。
# 需要时才在本文件按同名键覆盖默认（cable_candidates 整体覆盖；flash/efuse 按键合并）。
schema_version = 1

[programmer]
device = "GW5AT-15A"               # SLogic16U3 = Gowin GW5AT-15A（IDCODE 0x0001681B）

# --- 可选覆盖（默认见 resources/programmer.toml）---
# cable_candidates = [4, 1, 5]     # 调整探测顺序（默认 [4, 1, 5, 0]）
# [programmer.flash]
# image = "firmware/dfu.fs"        # 默认 glob firmware/dfu.*，通常无需指定
# [programmer.switch]              # DFU<->APP 保底切换（产品不支持 USB RECONFIG 时用）
# dfu2app = ["--run", "52", "--fsFile", "firmware/app_sram.fs"]  # 含 "/" 按本目录解析
# app2dfu = ["--run", "52", "--fsFile", "firmware/dfu.fs"]
