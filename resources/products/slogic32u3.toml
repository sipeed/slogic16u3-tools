# SLogic32U3 产品档案
schema_version = 1

[product]
id = "slogic32u3"
display_name = "SLogic32U3"

[usb]
vid = 0x359F
app_pid = 0x3032
ota_pid = 0x30F1   # "SLogic DFU"，与 16U3 共用（DFU 模式不区分产品型号，dmesg 实测确认）

[capture]
driver = "sipeed-slogic-analyzer"
num_channels = 32                   # unitsize = 4 字节/样本
max_bandwidth_mbps = 800
channel_options = [8, 16, 32]
# 采样率档位。高档位需要更少通道的分组：采样时工具自动先下发
# logic_channels=<通道数>（切换分组）再设采样率：32ch@200M / 16ch@400M / 8ch@800M。
# 实测（2026-09-14，S/N 202608052052）：400M/800M 档位可解锁、分组数据通路正常
# （Emulation 数据完整），但分组模式下真实引脚输入全零且与阈值无关——
# 定位为 FPGA 分组模式输入前端（引脚采样/多路复用）问题，待固件修复。
samplerates = ["10M", "20M", "25M", "40M", "50M", "80M", "100M", "160M", "200M", "400M", "800M"]
voltage_threshold_v = 1.6
default_samples = "1M"
default_channels = 32        # GUI 默认选择
default_samplerate = "200M"

[[capture.tests]]
channels = 32
samplerate = "200M"
samples = "1M"

# 以下分组测试点待固件修复"分组模式输入前端全零"问题后启用：
# [[capture.tests]]
# channels = 16
# samplerate = "400M"
# samples = "1M"
#
# [[capture.tests]]
# channels = 8
# samplerate = "800M"
# samples = "1M"

[expected]
freq_hz = 10_000_000
duty_pct = 50.0
freq_tol_pct = 5.0
duty_tol_pp = 5.0

[firmware]
app = "firmware/slogic32u3/app.bin"
app_flash_addr = 0x0                 # TBD：随硬件确认修改
verify = true

[mode_switch]
# 32U3 支持 USB 控制传输 RECONFIG（协议规范 0x30 设备管理扩展）自动双向切换
# OTA<->APP：wValue=1 触发、wIndex=0x5253。工具在切换步骤直接下发，无需人工。
method = "usb_reconfig"

[blank_flash]
dir = "blank_flash/slogic32u3"

[timeouts]
wait_ota_device_s = 30
wait_app_device_s = 30
ota_flash_s = 600
capture_s = 120
blank_flash_step_s = 120
