# 共享烧录器命令声明（公开，入库）
#
# SLogic 各型号（16U3 / 32U3 / 后续）用的是同一个 Gowin Programmer，故 cli 集中在此，
# 各 products/<id>/programmer.toml 不再各写一遍（它们只声明 device / cable / flash /
# efuse / switch 这些每产品不同的部分）。
#
# cli 解析优先级：产品档案的 cli/cli_<平台>  →  本文件  →  代码内平台默认。
# 首元素含 "/" 时按 resources/ 目录解析为绝对路径；解析出的路径不存在则自动回退到
# 下一优先级（因此下面写版本无关名、而工位实际放了带版本号的 AppImage 时，代码会
# glob 兜底找到它，仍可用）。

# 除 device 外，各产品 programmer.toml 通常什么都不用写——下面这些都是共享默认，
# 需要时才在 products/<id>/programmer.toml 里按同名键覆盖（cable_candidates 整体覆盖；
# [programmer.flash] / [programmer.efuse] 按键合并）。含 "/" 的路径按各产品目录解析。

schema_version = 1

[programmer]
# Linux：把 Gowin Programmer 的 AppImage 放到 resources/bin/ 并重命名/软链为版本无关名，
# 升级时只换文件、无需改配置（代码也兼容 Gowin-Programmer-<版本>-x86_64.AppImage 原名）。
cli = ["bin/Gowin-Programmer-x86_64.AppImage", "--programmer-cli"]

# Windows：把整个 Gowin Programmer 文件夹拷进 resources/bin/Programmer/
#（相当于 Linux 的软链——只是 Windows 用拷贝），指向其中的 programmer_cli.exe。
cli_windows = ["bin/Programmer/bin/programmer_cli.exe"]

timeout_s = 30

# 探测线缆候选：逐个试 --cable-index，首个读到本 device 的即用（读不到本 device
# 的会 IDCODE 不符而跳过，故顺序只影响速度、不会连错）。
# 5 放最前：Linux 台架与装了 WinUSB 驱动的 Windows 台架都命中 5。
cable_candidates = [5, 4, 1, 0]    # 5=WINUSB, 4=USB Debugger A, 1=FT2CH, 0=GWU2X

[programmer.flash]                 # 烧空板：把 DFU 位流写入外部 SPI Flash
image = "firmware/dfu.*"           # 取各产品 firmware/ 下的 dfu 位流（dfu.fs 或 dfu.bin）
spiaddr = 0x800000                 # 外部 SPI Flash 8M 偏移（golden image 槽）
timeout_s = 600                    # 烧录专用看门狗：顶层 timeout_s=30 只管探测，
                                   # 烧录沿用它会在中途被杀（Gowin Windows 版 ~3 分钟）
# Windows 烧录改走 openFPGALoader：实测 Gowin Windows 版 exe 慢 10 倍（175s，与
# 频率/LatencyTimer/驱动无关），openFPGALoader 仅 ~12s（快 15 倍），写入内容已用
# Gowin --run 66 交叉校验一致。模板变量 {image}/{spiaddr} 运行时替换；首元素按
# resources/ 解析，可执行文件缺失时自动回退上面的 Gowin 命令形态。
# 前置（一次性）：FTDI A 通道需 WinUSB 驱动 ——
#   Downloads\wdi-simple.exe -v 0x0403 -p 0x6010 -i 0 -t 0 -n "USB Serial Converter A (WinUSB)"
# （装完 Gowin 探测/eFuse 自动改走 cable-index 5；删掉下行即回退 Gowin 慢速烧录。）
# --verify 强制回读校验：产线二供 flash 型号常不在 openFPGALoader 的 JEDEC 表里
# （回显 "flash chip unknown"），此时它即使擦+写全过也会硬返回非零退出码，故不能只
# 认退出码。带 --verify 后它回读比对（Reading→Done），programmer.py 的
# _openfpga_flash_ok 以"校验通过"为准判成功，既解掉误判、又不放行没写对的板。
argv_windows = ["bin/openFPGALoader/openFPGALoader.exe", "-c", "ft2232",
                "--external-flash", "--verify", "-o", "{spiaddr}", "{image}"]
# run 默认 54 = exFlash Erase,Program,Verify Arora V（--fsFile 通吃 .fs/.bin 位流）；
# 切勿用 55/56（那是 RISC-V "C Bin"，烧位流会写 0 字节）。

[programmer.efuse]                 # eFuse AES 密钥写入 + 锁定（不可逆）
key_file = "firmware/efuse.ekey"   # 各产品 firmware/ 下的 .ekey（机密，绝不入库）
