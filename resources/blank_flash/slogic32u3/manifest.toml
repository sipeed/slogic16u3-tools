# 空板刷机命令清单（SLogic32U3）
# 脚本/工具由负责同事放入本目录（见仓库根 TODO.md），argv 相对路径按本目录解析。
# argv 为通用命令；argv_linux / argv_windows / argv_darwin 对应平台优先。
# 烧录可用 openFPGALoader（跨平台）替代 Gowin programmer；eFuse Lock 仍需 Gowin 工具。
schema_version = 1

[[steps]]
name = "flash"
label = "Gowin Flash (DFU FW)"
argv = ["bash", "gowin_flash.sh"]
argv_windows = ["cmd", "/c", "gowin_flash.bat"]
# openFPGALoader 替代示例:
# argv = ["./openFPGALoader-linux-x86_64", "--external-flash", "dfu.fs"]
timeout_s = 300
in_pipeline = true

# 注：DFU<->APP 模式切换不再是空板刷机步骤——见产品档案 [mode_switch]。
# 32U3 = usb_reconfig：工具用 USB 控制传输 RECONFIG（协议规范 0x30）自动双向切换。
# 原 "USB Reset" 步骤已移除。

[[steps]]
name = "lock"
label = "eFuse Lock"
argv = ["bash", "efuse_lock.sh"]
argv_windows = ["cmd", "/c", "efuse_lock.bat"]
timeout_s = 60
in_pipeline = false
