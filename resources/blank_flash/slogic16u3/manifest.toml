# 空板刷机命令清单（SLogic16U3）
# 管理员将所需脚本/可执行文件与本 manifest 放在同一目录，argv 中的相对路径按本目录解析。
# 步骤按声明顺序显示；in_pipeline = true 的步骤按顺序纳入一键全流程。
#
# 跨平台：argv 为通用命令；提供 argv_linux / argv_windows / argv_darwin 时，
# 对应平台优先使用之。例如 Windows 产线放 .bat/.exe 并写 argv_windows。
#
# 烧录一步可用 openFPGALoader（开源、跨平台，支持 Gowin，把对应平台的
# 可执行文件放入本目录即可随资源包分发）替代 Gowin programmer；
# eFuse Lock 无开源替代，仍需 Gowin 官方工具（Linux/Windows 均有 CLI）。
schema_version = 1

# 外置 JTAG 烧录器探测（只读）：GUI 首行 🔄 按钮触发，直调 Gowin Programmer
# --run 0（读器件码）+ --keyread（读 eFuse 锁定位），据此判定"烧录器是否连着器件"
# 并显示 eFuse 状态（未知/未锁/已锁）。绝不写芯片。缺省则无探测能力。
[probe]
device = "GW5AT-15A"               # SLogic16U3 = Gowin GW5AT-15A（IDCODE 0x0001681B）
cable_candidates = [4, 1, 5]      # 逐个试 --cable-index：4=USB Debugger A，1=FT2CH，5=WINUSB
timeout_s = 30
# app = "../../bin/Gowin-Programmer-1.9.12.03-2712-x86_64.AppImage"  # 可选，覆盖默认

[[steps]]
name = "flash"
label = "Gowin Flash (DFU FW)"
argv = ["bash", "gowin_flash.sh"]
argv_windows = ["cmd", "/c", "gowin_flash.bat"]
# openFPGALoader 替代示例（按实际线缆/板卡参数调整，dfu.fs 一并放入本目录）:
# argv = ["./openFPGALoader-linux-x86_64", "--external-flash", "dfu.fs"]
# argv_windows = ["openFPGALoader-windows.exe", "--external-flash", "dfu.fs"]
timeout_s = 300
in_pipeline = true

# 注：DFU<->APP 模式切换不再是空板刷机步骤——它属于烧完 app.bin 之后的独立环节，
# 由产品档案 [mode_switch] 声明（16U3=manual：外置 JTAG + gowin_cli 人工切换；
# 32U3=usb_reconfig：USB 控制传输 RECONFIG 自动切换）。原 "USB Reset" 步骤已移除。

[[steps]]
name = "lock"
label = "eFuse Lock"
argv = ["bash", "efuse_lock.sh"]
argv_windows = ["cmd", "/c", "efuse_lock.bat"]
timeout_s = 60
in_pipeline = false
