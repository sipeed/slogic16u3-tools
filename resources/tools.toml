# 产测工具依赖的外部二进制：「环境准备」页按本清单下载、校验后放进 resources/。
#
# 每项固定版本和 sha256：下载内容与 sha256 不符一律丢弃，绝不运行未校验的文件。
# 升级某个工具 = 改这里的 urls / sha256（维护脚本：python -m slogicpt.tools --hash <file>）。
#
#   platform  linux | windows（只在对应平台上需要）
#   dest      相对 resources/ 的目标路径（与代码里查找的位置一致）
#   urls      按顺序尝试的下载地址；「环境准备」页可选先走 GitHub 还是 Sipeed 下载站
#   manual    全部下载失败时提示用户手动下载的页面
#   required  缺了就不能产测（true），或只影响部分功能（false）
#
# Sipeed 下载站对大于 10 MB 的文件要图形验证码，程序下载不了（返回 "This is a
# large file"），会提示用户去 manual 页面手动下载，再放到 dest。
schema_version = 1

[[tool]]
id       = "sigrok-cli"
name     = "sigrok-cli (SLogic 2.3.2)"
platform = "linux"
dest     = "bin/sigrok-cli-linux-x86_64"
sha256   = "788dcaaaffe13762d97d3ba4e476a030e922b0d46a5dd9ff9221907ab405941d"
urls     = [
  "https://github.com/sipeed/SLogic/releases/download/release-2.3.2/sigrok-cli-SLogic-2.3.2-linux-x86_64.AppImage",
  "https://dl.sipeed.com/SLogic/Software/release-2.3.2/sigrok-cli-SLogic-2.3.2-linux-x86_64.AppImage",
]
manual   = "https://dl.sipeed.com/shareURL/SLogic/Software/release-2.3.2"
required = true

[[tool]]
id       = "sigrok-cli"
name     = "sigrok-cli (SLogic 2.3.2)"
platform = "windows"
dest     = "bin/sigrok-cli-windows-x86_64.exe"
sha256   = "6a9f146db0400e90630028d41ab0656f77e8f3b24ac02083fdd7a95ab807f76e"
urls     = [
  "https://github.com/sipeed/SLogic/releases/download/release-2.3.2/sigrok-cli-SLogic-2.3.2-windows-x86_64.exe",
  "https://dl.sipeed.com/SLogic/Software/release-2.3.2/sigrok-cli-SLogic-2.3.2-windows-x86_64.exe",
]
manual   = "https://dl.sipeed.com/shareURL/SLogic/Software/release-2.3.2"
required = true

